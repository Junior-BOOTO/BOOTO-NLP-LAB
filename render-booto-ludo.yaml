services:
  - type: web
    name: booto-ludo-ai
    runtime: python
    plan: starter
    rootDir: booto-ludo-ai
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
