services:
  - type: web
    name: booto-nlp-lab
    runtime: python
    region: ohio
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run app/main.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
